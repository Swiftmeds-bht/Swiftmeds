# Mutation testing for the Holds domain and app packages (SCRUM-113).
# Run from services/holds:
#   GOWORK=off gremlins unleash ./internal/domain
#   GOWORK=off gremlins unleash ./internal/app
# or from the repository root: make mutation (scripts/mutation-tests.sh).
# Gremlins: https://gremlins.dev (go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0)
unleash:
  integration: false
  timeout-coefficient: 10
  # Fail the run if fewer than 90% of covered mutants are killed, or fewer than
  # 60% of mutants are on tested code. SCRUM-113 asks for at least 70% efficacy.
  # Mutant coverage is low in internal/domain only because NewHold and Collect
  # check their input in tagless switch cases, which Go's coverage profile does
  # not record (13 mutants show as NOT COVERED although the tests run them).
  threshold:
    efficacy: 90
    mutant-coverage: 60

mutants:
  # Every mutator Gremlins has, not only the default ones.
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: true
  invert-bwassign:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  invert-negatives:
    enabled: true
  remove-self-assignments:
    enabled: true
