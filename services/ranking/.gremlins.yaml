# Mutation testing for the ranking domain (SCRUM-51).
# Run from services/ranking:   GOWORK=off gremlins unleash ./internal/domain
# Gremlins: https://gremlins.dev (go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0)
unleash:
  integration: false
  timeout-coefficient: 10
  # Fail the run if fewer than 95% of covered mutants are killed.
  threshold:
    efficacy: 95
    mutant-coverage: 95

mutants:
  # Every mutator Gremlins has, not only the default ones.
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: true
  invert-bwassign:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  invert-negatives:
    enabled: true
  remove-self-assignments:
    enabled: true
