# Traefik static configuration.
#
# Loaded with --configFile (see deploy/docker-compose.yml). When a config file is
# used, Traefik ignores all other CLI flags, so every static setting must be here.

entryPoints:
  # HTTP traffic for the REST gateway.
  web:
    address: ":8080"
  # HTTP traffic for the web apps (SCRUM-117). Published on host ports
  # ${PATIENT_APP_HTTP_PORT:-3000} and ${DASHBOARD_HTTP_PORT:-3001}.
  patient:
    address: ":3000"
  dashboard:
    address: ":3001"
  # gRPC traffic from the gateway to the services.
  grpc:
    address: ":50051"
  # Dashboard and API. Published on host port ${TRAEFIK_DASHBOARD_PORT:-8081}.
  traefik:
    address: ":8081"

api:
  dashboard: true
  # Serves the dashboard without auth on the "traefik" entrypoint. Local dev only.
  insecure: true

ping: {}

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Services must opt in with the label traefik.enable=true.
    exposedByDefault: false
