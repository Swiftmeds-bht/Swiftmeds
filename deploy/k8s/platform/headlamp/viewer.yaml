# The account people log in to Headlamp with: read-only.
# The built-in "view" role reads workloads, pods, logs, events and config maps
# in every namespace, but not Secrets. The extra role adds the cluster-wide
# things Headlamp's overview shows (nodes, storage, CRDs) and CPU/memory from
# metrics-server. Nothing here can create, change or delete.
# A login token: kubectl -n headlamp create token headlamp-viewer --duration=8h
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  labels: {app.kubernetes.io/name: headlamp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-view
  labels: {app.kubernetes.io/name: headlamp}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - {kind: ServiceAccount, name: headlamp-viewer, namespace: headlamp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: headlamp-viewer-cluster
  labels: {app.kubernetes.io/name: headlamp}
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-cluster
  labels: {app.kubernetes.io/name: headlamp}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: headlamp-viewer-cluster
subjects:
  - {kind: ServiceAccount, name: headlamp-viewer, namespace: headlamp}
