# The deployment's cluster on the team laptop (overlays/prod): k3s in Docker, made with k3d.
#   k3d cluster create --config deploy/k8s/overlays/prod/cluster.yaml
#   http://localhost:9000  patient app
#   http://localhost:9001  pharmacy dashboard
#   http://localhost:9080  API gateway
# The public URL comes through a Cloudflare Tunnel to Traefik (SCRUM-75).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: swiftmed
servers: 1
agents: 0
image: rancher/k3s:v1.36.6-k3s1
ports:
  - port: 9080:8080
    nodeFilters: [loadbalancer]
  - port: 9000:3000
    nodeFilters: [loadbalancer]
  - port: 9001:3001
    nodeFilters: [loadbalancer]
options:
  k3s:
    extraArgs:
      # SwiftMed runs its own Traefik (base/traefik.yaml); k3s's would compete for the ports.
      - arg: --disable=traefik
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
