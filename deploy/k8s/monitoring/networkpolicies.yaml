# The monitoring namespace denies by default too. Grafana is reached with
# kubectl port-forward, which these rules do not affect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-from-grafana
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: grafana}
      ports:
        - {port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-from-grafana-and-alloy
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [grafana, alloy]}
      ports:
        - {port: 3100}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-state-metrics-from-prometheus
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {port: 8080}
