# holds: gRPC service. Generated from deploy/docker-compose.yml (SCRUM-108), then reviewed.
# Other services reach it through Traefik (traefik:50051) with :authority "holds",
# as in Compose; the Ingress below is that route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holds
  labels:
    app.kubernetes.io/name: holds
    app.kubernetes.io/part-of: swiftmed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: holds
  template:
    metadata:
      labels:
        app.kubernetes.io/name: holds
        app.kubernetes.io/part-of: swiftmed
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-postgres
          image: ghcr.io/swiftmeds-bht/seed
          command: ["sh", "-c", "until pg_isready -h postgres -q; do echo waiting for postgres; sleep 2; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        - name: wait-for-rabbitmq
          image: ghcr.io/swiftmeds-bht/seed
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: holds
          image: ghcr.io/swiftmeds-bht/holds
          ports:
            - {name: grpc, containerPort: 50065}
          env:
            - name: HOLDS_CALL_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_CALL_TIMEOUT}
            - name: HOLDS_GRPC_PORT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_GRPC_PORT}
            - name: HOLDS_HOLD_DURATION
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_HOLD_DURATION}
            - name: HOLDS_MAX_ACTIVE_PER_USER
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_MAX_ACTIVE_PER_USER}
            - name: HOLDS_PENDING_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_PENDING_TIMEOUT}
            - name: HOLDS_SWEEP_INTERVAL
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_SWEEP_INTERVAL}
            - name: HOLDS_UPSTREAM
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: HOLDS_UPSTREAM}
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: LOG_LEVEL}
            - name: HOLDS_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: swiftmed-secrets, key: HOLDS_DATABASE_URL}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: swiftmed-secrets, key: RABBITMQ_URL}
          # The server reports SERVING on grpc.health.v1 only once migrations ran and it listens.
          startupProbe:
            grpc: {port: 50065}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            grpc: {port: 50065}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 50065}
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving a few seconds after a delete, until Traefik has dropped this
          # pod from its endpoints; otherwise calls in that gap fail (zero-downtime
          # updates and self-healing).
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: holds
  labels:
    app.kubernetes.io/name: holds
    app.kubernetes.io/part-of: swiftmed
  annotations:
    # The services speak plaintext HTTP/2 (gRPC without TLS).
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  selector:
    app.kubernetes.io/name: holds
  ports:
    - {name: grpc, port: 50065, targetPort: grpc}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holds-grpc
  labels:
    app.kubernetes.io/name: holds
    app.kubernetes.io/part-of: swiftmed
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: grpc
spec:
  ingressClassName: swiftmed
  rules:
    - host: holds
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: holds
                port: {name: grpc}
