# The seed Job, kept apart from deploy/k8s so `kubectl apply -k deploy/k8s` can
# be run again and again without touching a finished Job. It reads the Secret
# swiftmed-secrets that deploy/k8s creates.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swiftmed
resources:
  - job.yaml
images:
  - {name: ghcr.io/swiftmeds-bht/seed, newTag: dev}
