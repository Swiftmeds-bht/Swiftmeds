# Who may connect to whom inside the swiftmed namespace (SCRUM-108): the
# Kubernetes side of the open-ports finding in SCRUM-127. Everything is denied
# unless a policy below allows it. These are ingress rules; outbound traffic is
# not restricted.
#
#   outside world  -> Traefik :8080 :3000 :3001 only (gateway and web apps)
#   any pod here   -> Traefik :50051 (service-to-service gRPC)
#   Traefik        -> the services, the gateway and the web apps
#   web apps       -> gateway (they call it directly, server side)
#   *-client pods  -> Postgres :5432 / RabbitMQ :5672
#
# Pods that use Postgres or RabbitMQ carry the labels
# swiftmed/postgres-client: "true" / swiftmed/rabbitmq-client: "true".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: traefik}
  policyTypes: [Ingress]
  ingress:
    # The public entrypoints, from anywhere (the k3d load balancer, the tunnel).
    - ports:
        - {port: 8080}
        - {port: 3000}
        - {port: 3001}
    # gRPC routing and the admin port (ping, dashboard), from this namespace only.
    - from:
        - podSelector: {}
      ports:
        - {port: 50051}
        - {port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-from-traefik
spec:
  # Every service, the gateway and the web apps: reached only through Traefik.
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: NotIn, values: [traefik, postgres, rabbitmq]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-from-web-apps
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: gateway}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app.kubernetes.io/name, operator: In, values: [patient-app, pharmacy-dashboard]}
      ports:
        - {port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {swiftmed/postgres-client: "true"}
      ports:
        - {port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {swiftmed/rabbitmq-client: "true"}
      ports:
        - {port: 5672}
