# RabbitMQ (SCRUM-108). As in Compose, the broker user comes from the Secret and
# no definitions are loaded at boot: pkg/messaging declares the swiftmed.events
# exchange and the queues itself. The user is created only on a new volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftmed
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: swiftmed
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: swiftmed-secrets, key: RABBITMQ_DEFAULT_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: swiftmed-secrets, key: RABBITMQ_DEFAULT_PASS}}
          readinessProbe:
            exec:
              # Waits for the Erlang cookie, as in deploy/docker-compose.yml: run
              # (as root) before the server writes it, the CLI creates one the
              # server cannot read and RabbitMQ crashes.
              command: ["sh", "-c", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q check_port_connectivity"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
