# The SwiftMed web app (SCRUM-108; one app since SCRUM-139): patients at "/",
# pharmacy staff at /pharmacy-portal, on Traefik's "patient" entrypoint (:3000;
# the name predates the merge). It calls the gateway inside the cluster, from
# the server side only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: swiftmed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: swiftmed
    spec:
      securityContext:
        # The image's user is "node" by name; Kubernetes needs the number to check it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ghcr.io/swiftmeds-bht/web
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: GATEWAY_URL
              valueFrom: {configMapKeyRef: {name: swiftmed-config, key: GATEWAY_URL}}
            - name: USE_DEMO_DATA
              valueFrom: {configMapKeyRef: {name: swiftmed-config, key: USE_DEMO_DATA}}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          # Keep serving a few seconds after a delete, until Traefik has dropped this
          # pod from its endpoints; otherwise calls in that gap fail (zero-downtime
          # updates and self-healing).
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: patient
spec:
  ingressClassName: swiftmed
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {name: http}
