# search: gRPC service. Generated from deploy/docker-compose.yml (SCRUM-108), then reviewed.
# Other services reach it through Traefik (traefik:50051) with :authority "search",
# as in Compose; the Ingress below is that route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: swiftmed
spec:
  # No replicas here: the HorizontalPodAutoscaler (hpa.yaml, minimum 2) owns the
  # count, and a fixed number would reset it on every kubectl apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: swiftmed
        swiftmed/rabbitmq-client: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-rabbitmq
          image: ghcr.io/swiftmeds-bht/seed
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
          securityContext: {runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      containers:
        - name: search
          image: ghcr.io/swiftmeds-bht/search
          ports:
            - {name: grpc, containerPort: 50060}
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: LOG_LEVEL}
            - name: SEARCH_CALL_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: SEARCH_CALL_TIMEOUT}
            - name: SEARCH_GRPC_PORT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: SEARCH_GRPC_PORT}
            - name: SEARCH_REQUEST_TIMEOUT
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: SEARCH_REQUEST_TIMEOUT}
            - name: SEARCH_UPSTREAM
              valueFrom:
                configMapKeyRef: {name: swiftmed-config, key: SEARCH_UPSTREAM}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: swiftmed-secrets, key: RABBITMQ_URL}
          # The server reports SERVING on grpc.health.v1 only once migrations ran and it listens.
          startupProbe:
            grpc: {port: 50060}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            grpc: {port: 50060}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 50060}
            periodSeconds: 10
            failureThreshold: 3
          # Keep serving a few seconds after a delete, until Traefik has dropped this
          # pod from its endpoints; otherwise calls in that gap fail (zero-downtime
          # updates and self-healing).
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: swiftmed
  annotations:
    # The services speak plaintext HTTP/2 (gRPC without TLS).
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  selector:
    app.kubernetes.io/name: search
  ports:
    - {name: grpc, port: 50060, targetPort: grpc}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: search-grpc
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: swiftmed
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: grpc
spec:
  ingressClassName: swiftmed
  rules:
    - host: search
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: search
                port: {name: grpc}
