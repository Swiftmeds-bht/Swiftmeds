# Loads the demo data (deploy/seed/seed.sh, the same as `make seed`). A CronJob
# that never runs on its own (suspend: true), so it gets each overlay's image tag
# and can be started any number of times:
#   kubectl -n swiftmed create job seed-$(date +%s) --from=cronjob/seed
# seed.sh waits for the services' migrations itself and is safe to repeat.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: swiftmed
spec:
  suspend: true
  schedule: "0 0 1 1 *"
  jobTemplate:
    spec:
      backoffLimit: 4
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seed
            swiftmed/postgres-client: "true"
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: seed
              image: ghcr.io/swiftmeds-bht/seed
              env:
                - {name: PGHOST, value: postgres}
                - name: PGUSER
                  valueFrom: {secretKeyRef: {name: swiftmed-secrets, key: POSTGRES_USER}}
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: swiftmed-secrets, key: POSTGRES_PASSWORD}}
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits: {cpu: 500m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
