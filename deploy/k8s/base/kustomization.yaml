# SwiftMed on Kubernetes (SCRUM-108): the parts every cluster shares. Deploy
# through an overlay, which adds the image tags, the Secret and the sizes:
#   kubectl apply -k deploy/k8s/overlays/prod     the deployment (GHCR images, sealed secret)
#   kubectl apply -k deploy/k8s/overlays/local    a development cluster (:dev images, 1 replica)
# The runbook is docs/deployment.md. Docker Compose stays the local development
# stack (ADR 0005).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: swiftmed

resources:
  - namespace.yaml
  - networkpolicies.yaml
  - traefik.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - gateway.yaml
  - web.yaml
  - hpa.yaml
  - pdb.yaml
  - backup.yaml
  - seed.yaml
  # gRPC services, one file each (Deployment, Service, Ingress route).
  - services/analytics.yaml
  - services/auth.yaml
  - services/catalog.yaml
  - services/expiry.yaml
  - services/feedback.yaml
  - services/freshness.yaml
  - services/geo.yaml
  - services/holds.yaml
  - services/inventory.yaml
  - services/notification.yaml
  - services/pharmacy-registry.yaml
  - services/pricing.yaml
  - services/ranking.yaml
  - services/search.yaml
  - services/stock-sync.yaml
  - services/substitution.yaml
  - services/trust.yaml
  - services/user-profile.yaml
  - services/watchlist.yaml

configMapGenerator:
  # The name gets a content hash, so changing config.env rolls every pod that
  # reads it. Overlays may change single keys (behavior: merge).
  - name: swiftmed-config
    envs: [config.env]

# The Secret "swiftmed-secrets" (keys: secrets.env.example) comes from the
# overlay: a sealed secret in prod, a local file in local.
