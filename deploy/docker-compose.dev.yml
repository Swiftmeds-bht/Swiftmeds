# Local-only access to internal services for debugging. Keep this file out of
# production deploy commands.
services:
  pharmacy-dashboard:
    ports:
      - "127.0.0.1:${DASHBOARD_HTTP_PORT:-3001}:3001"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  traefik:
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8081}:8081"
