openapi: 3.0.3
info:
  title: SwiftMed Gateway REST API
  version: 1.0.0
  license:
    name: Proprietary (CST course project)
  description: |
    SwiftMed finds which verified pharmacies near a patient have a medicine in stock,
    lets the patient hold it for a short time, and lets the pharmacy hand it over
    against a pickup code. Clients talk REST to the gateway. The gateway checks the
    request and calls the matching gRPC method on the owning service.

    ## Implementation status

    Every operation has an `x-status`:

    | `x-status` | Meaning |
    |---|---|
    | `implemented` | The route exists in `services/gateway/internal/app/router.go` today. |
    | `planned` | The route is part of the agreed contract (derived from the `.proto` files and the test plan) but the gateway does not serve it yet. Until it does, `/api/v1/*` returns the plain-text 404 described below. |

    Every operation also has `x-grpc`, the gRPC method it calls, and `x-roles`, the
    roles allowed to call it. When a route is built, change its `x-status` to
    `implemented` in the same pull request.

    ## Conventions

    - **Base path.** All routes except `/healthz` start with `/api/v1`.
    - **JSON form.** Bodies follow protobuf JSON: `camelCase` names, enums as their full
      proto names (for example `HOLD_STATUS_ACTIVE`), timestamps as RFC 3339 UTC
      strings, and 64-bit integers as strings. A field that holds its default value
      (`0`, `false`, empty) may be left out of a response.
    - **Money** is in chhertum, sent as a string (100 chhertum = Nu. 1). `"0"` means the
      pharmacy has not set a price.
    - **IDs** are strings (UUIDs). **Distances** are whole metres. **Scores**
      (freshness, trust, rank) are numbers from 0.0 to 1.0.
    - **Paging.** List routes take `pageSize` and `pageToken` and return
      `page.nextPageToken`. An empty token means the first page, and an empty
      `nextPageToken` means the last page.
    - **Identity comes from the token, never from the body.** The gateway sets the
      `user_id`, `pharmacy_id` or `admin_user_id` of the gRPC request from the validated
      access token. Request bodies do not carry them, and a client cannot act for
      someone else.

    ## Authentication

    Send `Authorization: Bearer <accessToken>`. For every route that needs a token, the
    gateway calls `AuthService.ValidateToken` and receives the user ID, the role and, for
    pharmacy staff, the pharmacy ID. Access tokens last 15 minutes by default. Use
    `POST /api/v1/auth/refresh` to get a new pair. Routes marked public in this file
    (`security: []`) need no token.

    | Role | Who |
    |---|---|
    | `ROLE_PATIENT` | A patient |
    | `ROLE_PHARMACY_STAFF` | Staff of one pharmacy. They can act only on their own pharmacy. |
    | `ROLE_ADMIN` | SwiftMed staff, created outside the API (admins cannot self-register) |

    ## Errors

    Errors are JSON `{"error": "<message>"}`. The message never contains internal
    details, and a server fault always reads `internal error`. The gateway converts the
    gRPC status code of the failed call like this (`services/gateway/internal/httpx/errors.go`):

    | gRPC code | HTTP status |
    |---|---|
    | `INVALID_ARGUMENT` | 400 |
    | `UNAUTHENTICATED` | 401 |
    | `PERMISSION_DENIED` | 403 |
    | `NOT_FOUND` | 404 |
    | `CANCELED` | 408 |
    | `ALREADY_EXISTS`, `ABORTED` | 409 |
    | `FAILED_PRECONDITION` | 412 |
    | `RESOURCE_EXHAUSTED` | 429 |
    | `UNAVAILABLE` | 503 |
    | `DEADLINE_EXCEEDED` | 504 |
    | anything else, and a panic in a handler | 500 |

    Each operation lists the errors that are specific to it. Any operation can also
    return 500, 503 or 504, shown as `default`.

    Three cases do not use the JSON body, because the Go router and the CORS layer answer
    them before any handler runs:

    - A path under `/api/v1/` that has no route returns **404** with a plain-text body.
    - A known path called with the wrong method returns **405** with a plain-text body.
    - A CORS preflight (`OPTIONS`) from a missing origin returns **400**, and from an
      origin that is not allowed returns **403**, both as plain text.

    ## Request ID

    Send `X-Request-ID` to name a request. If you do not, the gateway makes one. Every
    response carries the same header, and it appears in the gateway's logs, so quote it
    when reporting a problem.

    ## CORS

    The gateway allows the origins in `CORS_ALLOWED_ORIGINS` (default
    `http://localhost:3000` and `http://localhost:3001`), with credentials. Allowed
    headers are `Authorization`, `Content-Type` and `X-Request-ID`. Allowed methods are
    `GET`, `POST`, `PUT`, `PATCH`, `DELETE` and `OPTIONS`. A preflight from an allowed
    origin returns 204.

    ## Not exposed

    These gRPC methods are for service-to-service calls and have no REST route:
    `Auth.ValidateToken`, `Catalog.BatchGetProducts`, `Catalog.ListProductsByMolecule`,
    `Expiry.GetHoldDuration`, `Freshness.RecordConfirmation`, `Freshness.GetFreshness`,
    `Holds.ExpireHold`, `Inventory.BatchGetStock`, `Inventory.BulkSetStock`,
    `Inventory.CommitReservation`, `Inventory.ReleaseReservation`,
    `Notification.SendNotification`, `PharmacyRegistry.BatchGetPharmacies`,
    `Pricing.BatchGetPrices`, `Ranking.RankOffers` and
    `Trust.GetTrust`, `Trust.BatchGetTrust`. Substitutes reach the patient inside the search response.
servers:
  - url: http://{host}:{port}
    description: Local development (`make up`, or `docker compose -f deploy/docker-compose.yml up -d`)
    variables:
      host:
        default: localhost
        description: Host that runs the gateway.
      port:
        default: "8080"
        description: The gateway's `GATEWAY_HTTP_PORT`.
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness check used by Docker and by load balancers.
  - name: Auth
    description: Accounts and tokens. Public, except that they need a valid refresh token where noted.
  - name: Catalog
    description: Medicine names, strengths and forms. Controlled medicines are never returned.
  - name: Search
    description: The patient's "who has this medicine near me?" query.
  - name: Pharmacies
    description: Pharmacy registration, details and admin verification.
  - name: Stock
    description: A pharmacy's stock, prices and CSV uploads, used by the pharmacy dashboard.
  - name: Holds
    description: Short reservations that a patient collects with a pickup code.
  - name: Feedback
    description: A patient's report on whether the medicine was really in stock.
  - name: Watchlist
    description: Alerts when a medicine comes back in stock nearby.
  - name: Notifications
    description: A user's in-app notifications.
  - name: Profile
    description: The signed-in user's contact details. No medical data is stored.
  - name: Analytics
    description: Unmet demand and pharmacy statistics.
  - name: Internal
    description: |
      Routes called by the scheduled Cloudflare Workers, not by people. They do not use a
      user token. The Worker sends the shared secret in the `X-Worker-Secret` header, and
      the gateway rejects a missing or wrong secret with 401.
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check that the gateway is running
      description: |
        Returns 200 while the process is serving requests. It does not check the
        downstream services. The gateway's `healthcheck` sub-command and the Docker
        HEALTHCHECK call it, and successful calls are not written to the request log.
      security: []
      x-status: implemented
      x-roles: []
      responses:
        "200":
          description: The gateway is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: ok
        "405":
          description: The path was called with a method other than GET. Plain-text body from the router.
          content:
            text/plain:
              schema:
                type: string
              example: Method Not Allowed
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a patient or pharmacy-staff account
      description: Admins cannot self-register. The password must be 8 to 72 bytes (bcrypt's limit).
      security: []
      x-status: implemented
      x-grpc: swiftmed.auth.v1.AuthService/Register
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: tashi@example.bt
              password: correct-horse-battery
              role: ROLE_PATIENT
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      security: []
      x-status: implemented
      x-grpc: swiftmed.auth.v1.AuthService/Login
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Keep the refresh token safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The email or password is wrong. The message does not say which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: The old refresh token stops working as soon as the new pair is issued.
      security: []
      x-status: implemented
      x-grpc: swiftmed.auth.v1.AuthService/RefreshToken
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The refresh token is invalid, expired, already used or revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke a refresh token
      description: Safe to call more than once with the same token.
      security:
        - bearerAuth: []
      x-status: implemented
      x-grpc: swiftmed.auth.v1.AuthService/Logout
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The refresh token is revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Find medicines by name
      description: |
        Matches brand and generic names, ignoring case, by prefix and by close spelling.
        Best match first. Pharmacy staff use it to find the product ID for a stock update.
      security: []
      x-status: planned
      x-grpc: swiftmed.catalog.v1.CatalogService/ResolveName
      x-roles: []
      parameters:
        - name: q
          in: query
          required: true
          description: The name as typed.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          description: Most products to return.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Matching products, best match first. The list is empty when nothing matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Catalog]
      operationId: createProduct
      summary: Add a medicine to the catalogue
      description: For administrators and seed data only.
      x-status: planned
      x-grpc: swiftmed.catalog.v1.CatalogService/CreateProduct
      x-roles: [ROLE_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: The product was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/products/{productId}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Get one medicine
      security: []
      x-status: planned
      x-grpc: swiftmed.catalog.v1.CatalogService/GetProduct
      x-roles: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/search:
    get:
      tags: [Search]
      operationId: searchMedicine
      summary: Find nearby pharmacies that have a medicine
      description: |
        Returns the matching medicines and, for each, the verified pharmacies that have it
        in stock, best first. Ranking uses only distance, how recently the stock was
        confirmed, the pharmacy's accuracy record and price. Nothing can be paid for a
        better place. If no pharmacy has the matched medicines, `substitutes` lists
        products with the same molecule and strength.

        Catalog, Geo and Inventory are required: if one fails the search fails with 503, or
        504 when out of time. Freshness, Pricing, Trust, Pharmacy Registry, Ranking and
        Substitution are optional. If one does not answer, the search still succeeds with
        neutral values and names the missing services in the `x-search-degraded` header.
        A whole search is capped at 2 seconds.

        Limits: 5 products, 100 nearby pharmacies and 5 substitutes per search.
      security: []
      x-status: implemented
      x-grpc: swiftmed.search.v1.SearchService/SearchMedicine
      x-roles: []
      parameters:
        - name: q
          in: query
          required: true
          description: Brand or generic name, 2 to 100 characters after trimming.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: lat
          in: query
          required: true
          description: Latitude of the patient, in degrees.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          description: Longitude of the patient, in degrees.
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: radius_m
          in: query
          description: |
            Search radius in metres. Omit or send 0 for the default of 5000. Otherwise it
            must be 500 to 50000.
          schema:
            type: integer
            minimum: 0
            maximum: 50000
            default: 0
        - name: max_offers
          in: query
          description: Most pharmacies to return per medicine. Omit or send 0 for the default of 10.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The search ran. `results` is empty when no medicine matches.
          headers:
            x-search-degraded:
              description: |
                Comma-separated names of optional services that did not answer, for example
                `freshness,ranking`. Absent when everything answered.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              example:
                searchId: 7c1f0d0e-6a53-4b8e-9a52-2f0f6f0c9a11
                results:
                  - productId: 3f6c7b2e-1d44-4d6f-9b0a-0a4d5f2f8c10
                    brandName: Napa
                    genericName: Paracetamol
                    strength: 500mg
                    offers:
                      - pharmacyId: 9b2d7a54-5c0e-4a77-8b11-6d2f3b1c4e20
                        pharmacyName: Druk Pharmacy
                        address: Norzin Lam, Thimphu
                        location:
                          latitude: 27.4728
                          longitude: 89.6393
                        distanceM: 420
                        quantityAvailable: 24
                        priceChhertum: "4500"
                        freshnessScore: 0.9
                        trustScore: 0.8
                        rankScore: 0.93
                        stockConfirmedAt: "2026-11-05T04:12:00Z"
                substitutes: []
        "400":
          description: |
            The query is shorter than 2 or longer than 100 characters, a coordinate is out of
            range, or `radius_m` or `max_offers` is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: A required service (Catalog, Geo or Inventory) is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The search took longer than its 2 second budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/search/autocomplete:
    get:
      tags: [Search]
      operationId: autocomplete
      summary: Suggest medicine names while the patient types
      security: []
      x-status: implemented
      x-grpc: swiftmed.search.v1.SearchService/Autocomplete
      x-roles: []
      parameters:
        - name: prefix
          in: query
          required: true
          description: The text typed so far, 2 to 100 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          description: Most suggestions to return, 1 to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        "200":
          description: Suggestions, best first. The list is empty when nothing matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocompleteResponse"
              example:
                suggestions:
                  - productId: 3f6c7b2e-1d44-4d6f-9b0a-0a4d5f2f8c10
                    displayName: Napa 500mg (Paracetamol)
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies:
    post:
      tags: [Pharmacies]
      operationId: registerPharmacy
      summary: Register a pharmacy
      description: |
        The signed-in pharmacy-staff user becomes the owner. The pharmacy starts as
        `VERIFICATION_STATUS_PENDING`, does not appear in search and cannot take holds
        until an administrator verifies it.
      x-status: planned
      x-grpc: swiftmed.pharmacyregistry.v1.PharmacyRegistryService/RegisterPharmacy
      x-roles: [ROLE_PHARMACY_STAFF]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPharmacyRequest"
      responses:
        "201":
          description: The pharmacy was registered and is waiting for verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A pharmacy with this licence number is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ServerError"
    get:
      tags: [Pharmacies]
      operationId: listPharmacies
      summary: List pharmacies by verification status
      description: Used by administrators to review pending pharmacies.
      x-status: planned
      x-grpc: swiftmed.pharmacyregistry.v1.PharmacyRegistryService/ListPharmacies
      x-roles: [ROLE_ADMIN]
      parameters:
        - name: status
          in: query
          description: Only pharmacies with this status. Omit to list all.
          schema:
            $ref: "#/components/schemas/VerificationStatus"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of pharmacies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies/{pharmacyId}:
    get:
      tags: [Pharmacies]
      operationId: getPharmacy
      summary: Get one pharmacy
      description: |
        Public, so the patient app can show a pharmacy's details. `ownerUserId` and
        `licenseNumber` are returned only to the pharmacy's own staff and to administrators.
      security: []
      x-status: planned
      x-grpc: swiftmed.pharmacyregistry.v1.PharmacyRegistryService/GetPharmacy
      x-roles: []
      parameters:
        - $ref: "#/components/parameters/PharmacyId"
      responses:
        "200":
          description: The pharmacy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies/{pharmacyId}/verification:
    put:
      tags: [Pharmacies]
      operationId: setPharmacyVerification
      summary: Approve, reject or suspend a pharmacy
      description: |
        Approving a pharmacy puts it on the map and into search. Suspending removes it.
        A reason is required for `VERIFICATION_STATUS_REJECTED` and
        `VERIFICATION_STATUS_SUSPENDED`.
      x-status: planned
      x-grpc: swiftmed.pharmacyregistry.v1.PharmacyRegistryService/SetVerificationStatus
      x-roles: [ROLE_ADMIN]
      parameters:
        - $ref: "#/components/parameters/PharmacyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVerificationRequest"
      responses:
        "200":
          description: The pharmacy with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pharmacy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies/{pharmacyId}/stats:
    get:
      tags: [Analytics]
      operationId: getPharmacyStats
      summary: Hold and feedback counts for a pharmacy
      x-status: planned
      x-grpc: swiftmed.analytics.v1.AnalyticsService/GetPharmacyStats
      x-roles: [ROLE_PHARMACY_STAFF, ROLE_ADMIN]
      parameters:
        - $ref: "#/components/parameters/PharmacyId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The counts for the time range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies/{pharmacyId}/feedback:
    get:
      tags: [Feedback]
      operationId: listPharmacyFeedback
      summary: List the feedback patients left about a pharmacy
      x-status: planned
      x-grpc: swiftmed.feedback.v1.FeedbackService/ListPharmacyFeedback
      x-roles: [ROLE_PHARMACY_STAFF, ROLE_ADMIN]
      parameters:
        - $ref: "#/components/parameters/PharmacyId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: One page of feedback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/pharmacies/{pharmacyId}/stock:
    get:
      tags: [Stock]
      operationId: listPharmacyStock
      summary: List all stock of a pharmacy
      description: The pharmacy dashboard's stock table.
