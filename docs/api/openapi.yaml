          description: Only this district. Omit for the whole country.
          schema:
            type: string
        - name: limit
          in: query
          description: Most items to return.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The unmet demand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmetDemandResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/internal/freshness/decay:
    post:
      tags: [Internal]
      operationId: runFreshnessDecay
      summary: Recompute stock freshness scores
      description: |
        Called every hour by the freshness-decay worker (`workers/freshness-decay`). Safe to
        repeat: the scores depend only on `asOf`. The caller sends the shared secret in
        `X-Worker-Secret`. If the gateway has no `WORKER_SHARED_SECRET` set, every call is
        rejected with 401.
      security:
        - workerSecret: []
      x-status: implemented
      x-grpc: swiftmed.freshness.v1.FreshnessService/ApplyDecay
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsOfRequest"
            example:
              asOf: "2026-11-05T07:00:00.000Z"
      responses:
        "200":
          description: How many scores were updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyDecayResponse"
              example:
                updatedCount: 12
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The `X-Worker-Secret` header is missing or wrong, or the gateway has no secret configured.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unauthorized
        default:
          $ref: "#/components/responses/ServerError"
  /api/v1/internal/expiry/sweep:
    post:
      tags: [Internal]
      operationId: runHoldExpirySweep
      summary: Expire every hold whose deadline has passed
      description: |
        Called on a schedule by the hold-expiry worker. Safe to repeat: a hold is expired and
        listed once, so a second call right after the first returns an empty list. A hold that
        expires exactly at `asOf` is expired. The caller sends the shared secret in
        `X-Worker-Secret`. If the gateway has no `WORKER_SHARED_SECRET` set, every call is
        rejected with 401. If Holds cannot be reached part-way, the holds already expired are
        returned and the rest are taken by the next sweep; if nothing could be expired the call
        fails with 503 or 504.
      security:
        - workerSecret: []
      x-status: implemented
      x-grpc: swiftmed.expiry.v1.ExpiryService/RunSweep
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsOfRequest"
            example:
              asOf: "2026-11-06T10:00:00.000Z"
      responses:
        "200":
          description: The holds that were expired by this call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSweepResponse"
              example:
                expiredHoldIds: ["3f2b8c1e-5d7a-4c19-9a53-0e1b6f7d2a44"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The `X-Worker-Secret` header is missing or wrong, or the gateway has no secret configured.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unauthorized
        default:
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /api/v1/auth/login` or `POST /api/v1/auth/refresh`.
        It is valid for 15 minutes by default. A missing, malformed, expired or revoked
        token gives 401. A valid token with the wrong role, or for another pharmacy's
        data, gives 403.
    workerSecret:
      type: apiKey
      in: header
      name: X-Worker-Secret
      description: |
        The secret shared by the gateway and the Cloudflare Workers (`WORKER_SHARED_SECRET`).
        Used only by the routes tagged Internal. A missing or wrong secret gives 401.
  headers:
    XRequestId:
      description: The request ID, echoed from the request or made by the gateway.
      schema:
        type: string
  parameters:
    PageSize:
      name: pageSize
      in: query
      description: Most items to return in one page. The owning service sets the default and the maximum.
      schema:
        type: integer
        minimum: 1
    PageToken:
      name: pageToken
      in: query
      description: The `page.nextPageToken` of the previous page. Omit for the first page.
      schema:
        type: string
    PharmacyId:
      name: pharmacyId
      in: path
      required: true
      description: ID of the pharmacy. Pharmacy staff can use only their own.
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      description: ID of the medicine in the catalogue.
      schema:
        type: string
        format: uuid
    HoldId:
      name: holdId
      in: path
      required: true
      description: ID of the hold.
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: ID of the watchlist subscription.
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      description: ID of the CSV upload job.
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      description: Start of the time range, inclusive (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the time range (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: The request is not valid (gRPC `INVALID_ARGUMENT`). The message says what to fix.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: quantity must be between 1 and 5
    Unauthorized:
      description: The access token is missing, malformed, expired or revoked (gRPC `UNAUTHENTICATED`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        The token is valid but its role is not allowed here, or the data belongs to another
        user or pharmacy (gRPC `PERMISSION_DENIED`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        The resource does not exist, or the caller is not allowed to know that it exists
        (gRPC `NOT_FOUND`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HoldChanged:
      description: |
        The hold changed at the same moment, for example it expired while this call ran, and
        this call lost. Read the hold again and decide (gRPC `ABORTED`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HoldNotActive:
      description: The hold is not `HOLD_STATUS_ACTIVE`, so it can no longer be changed (gRPC `FAILED_PRECONDITION`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: |
        Any other failure: 500 (`internal error`, details only in the logs), 503 when a
        service is unavailable, 504 when a call timed out, and so on, as in the table in the
        API description.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal error
  schemas:
    Error:
      type: object
      description: The body of every JSON error.
      required: [error]
      properties:
        error:
          type: string
          description: A short message that is safe to show to the user.
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    GeoPoint:
      type: object
      description: A WGS84 coordinate.
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Chhertum:
      type: string
      pattern: "^[0-9]+$"
      description: Money in chhertum as a decimal string (100 chhertum = Nu. 1). `"0"` means no price is set.
      example: "4500"
    Score:
      type: number
      format: double
      minimum: 0
      maximum: 1
    PageInfo:
      type: object
      properties:
        nextPageToken:
          type: string
          description: Pass it as `pageToken` to get the next page. Empty on the last page.
    Role:
      type: string
      enum: [ROLE_PATIENT, ROLE_PHARMACY_STAFF, ROLE_ADMIN]
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: 8 to 72 bytes. The limit is in bytes, so multi-byte characters count more than once.
        role:
          type: string
          enum: [ROLE_PATIENT, ROLE_PHARMACY_STAFF]
    RegisterResponse:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [userId, role, tokens]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        tokens:
          $ref: "#/components/schemas/TokenPair"
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshTokenResponse:
      type: object
      required: [tokens]
      properties:
        tokens:
          $ref: "#/components/schemas/TokenPair"
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    DosageForm:
      type: string
      enum:
        - DOSAGE_FORM_TABLET
        - DOSAGE_FORM_CAPSULE
        - DOSAGE_FORM_SYRUP
        - DOSAGE_FORM_SUSPENSION
        - DOSAGE_FORM_INJECTION
        - DOSAGE_FORM_CREAM
        - DOSAGE_FORM_OINTMENT
        - DOSAGE_FORM_DROPS
        - DOSAGE_FORM_INHALER
        - DOSAGE_FORM_OTHER
    Product:
      type: object
      required: [productId, brandName, genericName, strength]
      properties:
        productId:
          type: string
          format: uuid
        brandName:
          type: string
        genericName:
          type: string
        moleculeId:
          type: string
        moleculeName:
          type: string
        strength:
          type: string
          description: Lower case, no spaces, for example `500mg` or `125mg/5ml`.
        dosageForm:
          $ref: "#/components/schemas/DosageForm"
        packSize:
          type: integer
          format: int32
          description: Units per pack, for example 10 tablets.
        manufacturer:
          type: string
        requiresPrescription:
          type: boolean
    ProductList:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    CreateProductRequest:
      type: object
      required:
        [brandName, genericName, moleculeId, moleculeName, strength, dosageForm]
      properties:
        brandName:
          type: string
        genericName:
          type: string
        moleculeId:
          type: string
        moleculeName:
          type: string
        strength:
          type: string
        dosageForm:
          $ref: "#/components/schemas/DosageForm"
        packSize:
          type: integer
          format: int32
          minimum: 1
        manufacturer:
          type: string
        requiresPrescription:
          type: boolean
        controlled:
          type: boolean
          description: Narcotic or psychotropic. Controlled products are kept out of search and substitution.
    PharmacyOffer:
      type: object
      description: One pharmacy that has the medicine, with what the result card shows.
      required: [pharmacyId]
      properties:
        pharmacyId:
          type: string
          format: uuid
        pharmacyName:
          type: string
        address:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        distanceM:
          type: integer
          format: int32
          description: Straight-line distance in metres.
        quantityAvailable:
          type: integer
          format: int32
        priceChhertum:
          $ref: "#/components/schemas/Chhertum"
        freshnessScore:
          $ref: "#/components/schemas/Score"
        trustScore:
          $ref: "#/components/schemas/Score"
        rankScore:
          $ref: "#/components/schemas/Score"
        stockConfirmedAt:
          type: string
          format: date-time
          description: When the pharmacy last set or confirmed this stock.
    ProductResult:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
          format: uuid
        brandName:
          type: string
        genericName:
          type: string
        strength:
          type: string
        offers:
          type: array
          description: Best first.
          items:
            $ref: "#/components/schemas/PharmacyOffer"
    SearchResponse:
      type: object
      properties:
        searchId:
          type: string
          description: Identifies this search in logs and analytics.
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProductResult"
        substitutes:
          type: array
          description: Filled only when no pharmacy has the matched medicines.
          items:
            $ref: "#/components/schemas/ProductResult"
    Suggestion:
      type: object
      required: [productId, displayName]
      properties:
        productId:
          type: string
        displayName:
          type: string
          example: Napa 500mg (Paracetamol)
    AutocompleteResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
    VerificationStatus:
      type: string
      enum:
        - VERIFICATION_STATUS_PENDING
        - VERIFICATION_STATUS_VERIFIED
        - VERIFICATION_STATUS_REJECTED
        - VERIFICATION_STATUS_SUSPENDED
    Pharmacy:
      type: object
      required: [pharmacyId, name, status]
      properties:
        pharmacyId:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
          description: Returned only to the pharmacy's own staff and to administrators.
        name:
          type: string
        licenseNumber:
          type: string
          description: Returned only to the pharmacy's own staff and to administrators.
        phone:
          type: string
        address:
          type: string
        dzongkhag:
          type: string
          description: The district.
        location:
          $ref: "#/components/schemas/GeoPoint"
        status:
          $ref: "#/components/schemas/VerificationStatus"
        statusReason:
          type: string
          description: Set when the status is rejected or suspended.
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
    RegisterPharmacyRequest:
      type: object
      required: [name, licenseNumber, phone, address, dzongkhag, location]
      properties:
        name:
          type: string
        licenseNumber:
          type: string
        phone:
          type: string
        address:
          type: string
        dzongkhag:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
    PharmacyList:
      type: object
      properties:
        pharmacies:
          type: array
          items:
            $ref: "#/components/schemas/Pharmacy"
        page:
          $ref: "#/components/schemas/PageInfo"
    SetVerificationRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            - VERIFICATION_STATUS_VERIFIED
            - VERIFICATION_STATUS_REJECTED
            - VERIFICATION_STATUS_SUSPENDED
        reason:
          type: string
          description: Required for rejected and suspended.
    StockLevel:
      type: object
      required: [pharmacyId, productId]
      description: "`quantityAvailable` is `quantityOnHand` minus `quantityReserved` and is never negative."
      properties:
        pharmacyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantityOnHand:
          type: integer
          format: int32
        quantityReserved:
          type: integer
          format: int32
        quantityAvailable:
          type: integer
          format: int32
        confirmedAt:
          type: string
          format: date-time
          description: The last time the pharmacy set or confirmed this stock.
    StockList:
      type: object
      properties:
        stock:
          type: array
          items:
            $ref: "#/components/schemas/StockLevel"
        page:
          $ref: "#/components/schemas/PageInfo"
    SetStockRequest:
      type: object
      required: [quantityOnHand]
      properties:
        quantityOnHand:
          type: integer
          format: int32
          minimum: 0
          description: Must also be at least the quantity reserved by active holds.
    PriceUpdate:
      type: object
      required: [productId, priceChhertum]
      properties:
        productId:
          type: string
          format: uuid
        priceChhertum:
          $ref: "#/components/schemas/Chhertum"
    SetPricesRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PriceUpdate"
    Price:
      type: object
      properties:
        pharmacyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        priceChhertum:
          $ref: "#/components/schemas/Chhertum"
        updatedAt:
          type: string
          format: date-time
    SetPricesResponse:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"
    UploadStockCsvRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The CSV file, UTF-8, at most 1 MB. The file name is kept on the job.
    SyncJobStatus:
      type: string
      enum:
        - SYNC_JOB_STATUS_PROCESSING
        - SYNC_JOB_STATUS_COMPLETED
        - SYNC_JOB_STATUS_PARTIAL
        - SYNC_JOB_STATUS_FAILED
    RowError:
      type: object
      properties:
        rowNumber:
          type: integer
          format: int32
          description: 1-based, counting the header as row 1.
        message:
          type: string
    SyncJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          format: uuid
        pharmacyId:
          type: string
          format: uuid
        uploadedByUserId:
          type: string
          format: uuid
        filename:
          type: string
        status:
          $ref: "#/components/schemas/SyncJobStatus"
        rowsTotal:
          type: integer
          format: int32
        rowsApplied:
          type: integer
          format: int32
        rowsRejected:
          type: integer
          format: int32
        rowErrors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    SyncJobList:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/SyncJob"
        page:
          $ref: "#/components/schemas/PageInfo"
    HoldStatus:
      type: string
      description: |
        `PENDING` becomes `ACTIVE` or `REJECTED`. `ACTIVE` becomes `COLLECTED`, `CANCELLED`
        or `EXPIRED`. The other statuses are final.
      enum:
        - HOLD_STATUS_PENDING
        - HOLD_STATUS_ACTIVE
        - HOLD_STATUS_COLLECTED
        - HOLD_STATUS_EXPIRED
        - HOLD_STATUS_CANCELLED
        - HOLD_STATUS_REJECTED
    Hold:
      type: object
      required: [holdId, status]
      properties:
        holdId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        pharmacyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
        status:
          $ref: "#/components/schemas/HoldStatus"
        pickupCode:
          type: string
          description: Set once the hold is active. Shown only to the patient who made the hold.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Set when the hold becomes active.
        statusChangedAt:
          type: string
          format: date-time
        statusReason:
          type: string
          description: Set for rejected and cancelled holds.
    CreateHoldRequest:
      type: object
      required: [pharmacyId, productId, quantity]
      properties:
        pharmacyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 5

    HoldList:
      type: object
      properties:
        holds:
          type: array
          items:
            $ref: "#/components/schemas/Hold"
        page:
          $ref: "#/components/schemas/PageInfo"
    CancelHoldRequest:
      type: object
      properties:
        reason:
          type: string
          description: Why the patient cancelled. Stored as the hold's `statusReason`.
    CollectHoldRequest:
      type: object
      required: [pickupCode]
      properties:
        pickupCode:
          type: string
    SubmitFeedbackRequest:
      type: object
      required: [wasInStock]
      properties:
        wasInStock:
          type: boolean
        rating:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          description: 1 to 5, or 0 for no rating.
        comment:
          type: string
          maxLength: 500
    Feedback:
      type: object
      required: [feedbackId, holdId]
      properties:
        feedbackId:
          type: string
          format: uuid
        holdId:
          type: string
          format: uuid
        pharmacyId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        wasInStock:
          type: boolean
        rating:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
        comment:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    FeedbackList:
      type: object
      properties:
        feedback:
          type: array
          items:
            $ref: "#/components/schemas/Feedback"
        page:
          $ref: "#/components/schemas/PageInfo"
    Subscription:
      type: object
      required: [subscriptionId, productId]
      properties:
        subscriptionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        location:
          $ref: "#/components/schemas/GeoPoint"
        radiusM:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        notifiedAt:
          type: string
          format: date-time
          description: Set once the patient has been notified. The subscription does not fire again.
    SubscribeRequest:
      type: object
      required: [productId, location]
      properties:
        productId:
          type: string
          format: uuid
        location:
          $ref: "#/components/schemas/GeoPoint"
        radiusM:
          type: integer
          format: int32
          minimum: 0
