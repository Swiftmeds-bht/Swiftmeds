  /api/v1/holds:
    post:
      tags: [Holds]
      operationId: createHold
      summary: Hold some units of a medicine at a pharmacy
      description: |
        Reserves 1 to 5 units for a short time. The hold starts as `HOLD_STATUS_PENDING`
        while Inventory checks the stock, so the answer is 202. Poll
        `GET /api/v1/holds/{holdId}` until the status is `HOLD_STATUS_ACTIVE` (the pickup
        code is then set) or `HOLD_STATUS_REJECTED` (not enough stock). The patient is the
        signed-in user.
