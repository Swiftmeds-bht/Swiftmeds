      x-grpc: swiftmed.holds.v1.HoldsService/CreateHold
      x-roles: [ROLE_PATIENT]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHoldRequest"
            example:
              pharmacyId: 9b2d7a54-5c0e-4a77-8b11-6d2f3b1c4e20
              productId: 3f6c7b2e-1d44-4d6f-9b0a-0a4d5f2f8c10
              quantity: 2
      responses:
        "202":
          description: The hold was accepted and is `HOLD_STATUS_PENDING`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "400":
          description: The quantity is not 1 to 5, or an ID is missing or malformed.
