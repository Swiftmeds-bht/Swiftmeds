  /api/v1/watchlist/alerts:
    get:
      tags: [Watchlist]
      operationId: streamAlerts
      summary: Receive back-in-stock alerts as they happen
      description: |
        A long-lived response using server-sent events. Each event's `data` is one
        `StockAlert` as JSON. The stream stays open until the client closes it, so it is not
        cut off by a write timeout. A browser `EventSource` cannot send an `Authorization`
        header, so web clients read this stream with `fetch`.

        Each alert is one event: `id:` is the subscription ID, `event: alert`, and `data:`
        the `StockAlert` JSON. An idle stream sends a `: ping` comment every 15 seconds so
        proxies keep it open. If Watchlist fails, the stream ends with an `event: error`
        whose `data` is `{"error": "..."}`. Alerts that arrive while the client is away are
        kept and sent on the next connection, each once.
      x-status: implemented
      x-grpc: swiftmed.watchlist.v1.WatchlistService/StreamAlerts
      x-roles: [ROLE_PATIENT]
      responses:
        "200":
          description: |
            The event stream. Each event's `data:` line holds one `StockAlert` as JSON, for example
            `data: {"quantityAvailable":12,"occurredAt":"2026-11-05T06:30:00Z"}` (other fields left out here).
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StockAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/ServerError"
