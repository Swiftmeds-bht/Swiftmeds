name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftmed
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: freshness_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftmed -d freshness_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Install golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -sSfL https://golangci-lint.run/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2; then
              break
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Failed to install golangci-lint after ${attempt} attempts."
              exit 1
            fi

            echo "Retrying golangci-lint install (${attempt}/3)..."
            sleep 5
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare coverage output
        run: mkdir -p coverage

      - name: Run go vet and golangci-lint
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r module_dir; do
            echo "::group::Checks for ${module_dir}"
            pushd "${module_dir}" >/dev/null

            if packages="$(GOWORK=off go list ./...)" && [[ -n "${packages}" ]]; then
              GOWORK=off go vet ./...
              GOWORK=off golangci-lint run ./...
            else
              echo "No Go packages found; skipping vet and golangci-lint."
            fi

            popd >/dev/null
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')

      - name: Run tests with coverage
        env:
          FRESHNESS_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/freshness_db?sslmode=disable"
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r module_dir; do
            module_name="${module_dir#${GITHUB_WORKSPACE}/}"
            coverage_file="${GITHUB_WORKSPACE}/coverage/${module_name//\//_}.out"
            echo "::group::Tests for ${module_name}"
            pushd "${module_dir}" >/dev/null

            if packages="$(GOWORK=off go list ./...)" && [[ -n "${packages}" ]]; then
              GOWORK=off go test -race ./... -covermode=atomic -coverprofile="${coverage_file}"
            else
              echo "No Go packages found in ${module_name}; writing an empty coverage profile."
              printf 'mode: atomic\n' > "${coverage_file}"
            fi

            popd >/dev/null
            echo "::endgroup::"
          done < <(go list -m -f '{{.Dir}}')

      - name: Enforce coverage gate on core services
        run: ./scripts/coverage-gate.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          if-no-files-found: ignore

  integration:
    name: Go integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftmed
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftmed -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management
        env:
          RABBITMQ_DEFAULT_USER: swiftmed
          RABBITMQ_DEFAULT_PASS: change-me
        ports:
          - 5672:5672
        # `ping` passes before the AMQP listener accepts connections; this waits for it.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # One database per test suite: the suites empty their own tables, so sharing
    # one database would let them interfere when modules run in a different order.
    env:
      PG: "postgres://swiftmed:change-me@127.0.0.1:5432"
      RABBITMQ_URL: "amqp://swiftmed:change-me@127.0.0.1:5672/"
      POSTGRES_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/migrate_test?sslmode=disable"
      MESSAGING_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/messaging_test?sslmode=disable"
      EXPIRY_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/expiry_test?sslmode=disable"
      FEEDBACK_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/feedback_test?sslmode=disable"
      GEO_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/geo_test?sslmode=disable"
      HOLDS_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/holds_test?sslmode=disable"
      INVENTORY_TEST_DB_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/inventory_test?sslmode=disable"
      PRICING_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/pricing_test?sslmode=disable"
      TRUST_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/trust_test?sslmode=disable"
      WATCHLIST_TEST_DATABASE_URL: "postgres://swiftmed:change-me@127.0.0.1:5432/watchlist_test?sslmode=disable"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Create the test databases
        run: |
          for db in migrate_test messaging_test expiry_test feedback_test geo_test holds_test inventory_test pricing_test trust_test watchlist_test; do
            psql "${PG}/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${db}"
          done

      # Every //go:build integration package plus pkg/messaging, with -race and -v.
      # Fails if any of them skips because a URL above is missing.
      - name: Run Go integration tests
        run: ./scripts/integration-tests.sh

  compose-integration:
    name: Compose gateway integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATEWAY_URL: http://127.0.0.1:8080
      RABBITMQ_URL: amqp://swiftmed:change-me@127.0.0.1:5672/
      WORKER_SHARED_SECRET: change-me-worker-secret
      HOLDS_HOLD_DURATION: 5s
      EXPIRY_HOLD_DURATION: 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Start full Compose stack and seed demo data
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml --env-file .env up -d --build --wait --wait-timeout 900
          docker compose -f deploy/docker-compose.yml --env-file .env --profile seed run --rm seed

      - name: Run gateway cross-service suite
        working-directory: tests/integration
        run: GOWORK=off go test -tags integration -count=1 -v ./compose

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file .env down -v

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/patient-app/package-lock.json

      - name: Patient app checks
        working-directory: web/patient-app
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      # The dashboard is not built yet (SCRUM-58, SCRUM-70). This step starts
      # running as soon as it has a package.json.
      - name: Pharmacy dashboard checks
        if: hashFiles('web/pharmacy-dashboard/package.json') != ''
        working-directory: web/pharmacy-dashboard
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

  workers:
    name: Workers (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [freshness-decay, hold-expiry]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Typecheck and test
        working-directory: workers/${{ matrix.worker }}
        run: |
          npm ci
          npm run typecheck
          npm test

  saga-integration:
    name: Saga integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Starts Postgres and RabbitMQ with testcontainers (Docker is on the runner),
      # builds Holds and Inventory with -race and runs the saga scenarios (SCRUM-56).
      - name: Run saga integration tests
        working-directory: tests/integration
        env:
          GOWORK: "off"
        run: go test -tags integration -race -count=1 -v ./...
