syntax = "proto3";

// Substitution: equivalent products when a medicine is unavailable. Owner: Jigme. Core service.
//
// Rule (decision table in docs/test-plan.md): a substitute has the SAME molecule,
// SAME strength and SAME dosage form, is not controlled, and is not the product itself.
package swiftmed.substitution.v1;

option go_package = "github.com/Swiftmeds-bht/Swiftmeds/proto/gen/go/substitution/v1;substitutionv1";

service SubstitutionService {
  rpc GetSubstitutes(GetSubstitutesRequest) returns (GetSubstitutesResponse);
}

message Substitute {
  string product_id = 1;
  string brand_name = 2;
  string generic_name = 3;
  string strength = 4;
}

message GetSubstitutesRequest {
  string product_id = 1;
  int32 limit = 2;
}

message GetSubstitutesResponse {
  string molecule_id = 1;
  repeated Substitute substitutes = 2;
}
