syntax = "proto3";

// Pricing: each pharmacy's price for a product. Owner: Pema. Supporting service (minimal).
// All money is int64 chhertum (100 chhertum = Nu. 1).
package swiftmed.pricing.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Swiftmeds-bht/Swiftmeds/proto/gen/go/pricing/v1;pricingv1";

service PricingService {
  // Sets one or more prices for a pharmacy. Used by the dashboard and Stock Sync.
  rpc SetPrices(SetPricesRequest) returns (SetPricesResponse);
  rpc BatchGetPrices(BatchGetPricesRequest) returns (BatchGetPricesResponse);
}

message Price {
  swiftmed.common.v1.StockKey key = 1;
  // Price per pack. Must be > 0.
  int64 price_chhertum = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message PriceUpdate {
  string product_id = 1;
  int64 price_chhertum = 2;
}

message SetPricesRequest {
  string pharmacy_id = 1;
  repeated PriceUpdate updates = 2;
}

message SetPricesResponse {
  repeated Price prices = 1;
}

message BatchGetPricesRequest {
  repeated swiftmed.common.v1.StockKey keys = 1;
}

message BatchGetPricesResponse {
  // Keys with no price set are omitted.
  repeated Price prices = 1;
}
