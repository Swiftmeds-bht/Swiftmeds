syntax = "proto3";

// Ranking: orders pharmacy offers. Owner: Pema. Core service.
// Pure computation, no data and no outbound calls. Only objective factors;
// there is no paid placement.
//
//   score = w_distance*distance + w_freshness*freshness + w_trust*trust + w_price*price
// where each component is normalised to 0.0–1.0 (1.0 = best) across the candidate set.
package swiftmed.ranking.v1;

option go_package = "github.com/Swiftmeds-bht/Swiftmeds/proto/gen/go/ranking/v1;rankingv1";

service RankingService {
  rpc RankOffers(RankOffersRequest) returns (RankOffersResponse);
}

message Candidate {
  string pharmacy_id = 1;
  string product_id = 2;
  int32 distance_m = 3;
  double freshness_score = 4;
  double trust_score = 5;
  // 0 means unknown price; scored as the median of the set.
  int64 price_chhertum = 6;
  // Candidates with 0 are dropped.
  int32 quantity_available = 7;
}

// Must sum to 1.0. Omit to use the service defaults.
message Weights {
  double distance = 1;
  double freshness = 2;
  double trust = 3;
  double price = 4;
}

message ScoreBreakdown {
  double distance = 1;
  double freshness = 2;
  double trust = 3;
  double price = 4;
}

message RankedOffer {
  string pharmacy_id = 1;
  string product_id = 2;
  double score = 3;
  ScoreBreakdown breakdown = 4;
}

message RankOffersRequest {
  repeated Candidate candidates = 1;
  Weights weights = 2;
}

message RankOffersResponse {
  // Highest score first. Ties broken by distance, then pharmacy_id.
  repeated RankedOffer offers = 1;
}
