syntax = "proto3";

// Auth: accounts, passwords and JWTs. Owner: Yeshey.
// The gateway calls ValidateToken on every authenticated REST request.
package swiftmed.auth.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Swiftmeds-bht/Swiftmeds/proto/gen/go/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PATIENT = 1;
  ROLE_PHARMACY_STAFF = 2;
  ROLE_ADMIN = 3;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  // Only ROLE_PATIENT and ROLE_PHARMACY_STAFF can self-register.
  Role role = 3;
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  Role role = 2;
  TokenPair tokens = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  Role role = 2;
  // Set only for ROLE_PHARMACY_STAFF.
  string pharmacy_id = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}
